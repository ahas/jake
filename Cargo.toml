[workspace]
members = ["agent", "hub", "protocol"]
# The desktop app is a workspace of its own (docs/desktop.md, 「The crate and its workspace」).
exclude = ["desktop"]
resolver = "3"

# The contract tests run the debug builds through transfers of hundreds of megabytes; the hashing,
# base64 and WebSocket framing they pass through are dependencies, built optimised even there.
[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

# Dependencies carry no debug information in a test build either.
[profile.test.package."*"]
debug = false
