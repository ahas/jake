[workspace]
members = ["hub", "protocol"]
# The Rust agent is not built yet: its Windows run mode and its entry point are still to be written.
exclude = ["agent"]
resolver = "3"

# The contract tests run the debug builds through transfers of hundreds of megabytes; the hashing,
# base64 and WebSocket framing they pass through are dependencies, built optimised even there.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
