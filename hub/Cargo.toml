[package]
name = "jake-hub"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "jake-hub"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
bytes = "1"
dotenvy = "0.15"
form_urlencoded = "1"
# A credential of one agent name: HMAC-SHA256 over the name, keyed by the hub's agent key.
hmac = "0.12"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
indexmap = "2"
jake-protocol = { path = "../protocol" }
rand = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
