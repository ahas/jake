[package]
name = "jake-hub"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "jake-hub"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22"
bytes = "1"
dotenvy = "0.15"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
indexmap = "2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# The contract tests run the debug build through transfers of hundreds of megabytes; the hashing,
# base64 and WebSocket framing they pass through are dependencies, built optimised even there.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
