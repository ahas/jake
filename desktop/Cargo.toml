[package]
name = "jake-desktop"
version = "0.2.1"
edition = "2024"
publish = false

# A workspace of its own (docs/desktop.md, 「The crate and its workspace」): the root workspace's
# release build and lints must need no webview libraries, and this crate is built with unwinding.
[workspace]

[[bin]]
name = "jake-desktop"
path = "src/main.rs"

[features]
# The all-in-one app (docs/all-in-one.md): the whole BMO set installed and run on this machine, built with the
# configuration `tauri.all-in-one.conf.json` laid over the crate's own.
all-in-one = ["dep:sha2"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# The person's own sign-in registration, pinned to the per-user hive (docs/desktop.md, 「Starting at sign-in」).
auto-launch = "0.6"
jake-agent = { path = "../agent" }
# Windows Credential Manager, the Secret Service over D-Bus and the macOS Keychain, and no file store.
keyring = "4.2"
# The native message box that asks before a link changes the server (docs/desktop.md, 「Opening from a link」); not
# Tauri's dialog plugin, whose script replaces alert and confirm in every page the window shows, the console's among them.
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6", "gtk3"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The WSL image the all-in-one imports, checked against its folder's checksums.
sha2 = { version = "0.10", optional = true }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14"
# The system's language, which the tray's line after a quiet update is written in.
sys-locale = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
# The session's lock notifications and the system's wake request (docs/desktop.md, 「While the PC is locked」).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
