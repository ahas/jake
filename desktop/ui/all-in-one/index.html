<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BMO All-in-One</title>
    <link rel="stylesheet" href="../page.css" />
    <link rel="stylesheet" href="page.css" />
    <script src="page.js" defer></script>
  </head>
  <body>
    <header id="frame" class="frame" data-tauri-drag-region="deep">
      <span class="frame-title">BMO All-in-One</span>
      <div id="controls" class="controls" hidden>
        <button id="minimize" type="button" aria-label="최소화" title="최소화">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7.5" width="10" height="1" /></svg>
        </button>
        <button id="maximize" type="button" aria-label="최대화" title="최대화">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h10v10H3zm1 1v8h8V4z" /></svg>
        </button>
        <button id="close" class="close" type="button" aria-label="닫기" title="닫기">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.7 3 8 7.3 12.3 3l.7.7L8.7 8l4.3 4.3-.7.7L8 8.7 3.7 13l-.7-.7L7.3 8 3 3.7z" />
          </svg>
        </button>
      </div>
    </header>
    <main>
      <div class="panel">
        <header class="head">
          <span id="mark" class="mark idle" aria-hidden="true"></span>
          <h1 id="headline">BMO 준비 중</h1>
        </header>
        <div id="detail" class="detail"></div>
        <fieldset id="chat" class="choice" hidden>
          <legend>콘솔 말고 BMO와 대화할 채팅 서비스</legend>
          <label><input type="radio" name="chat" value="telegram" checked /> Telegram</label>
          <label><input type="radio" name="chat" value="discord" /> Discord</label>
        </fieldset>
        <form id="inputs" class="server" novalidate hidden></form>
        <p id="error" class="error" role="alert" hidden></p>
        <div class="actions">
          <button id="secondary" type="button" hidden></button>
          <button id="primary" class="primary" type="button" hidden></button>
        </div>
        <pre id="lines" class="lines" aria-live="polite" hidden></pre>
      </div>
    </main>
  </body>
</html>
