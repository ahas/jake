<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BMO</title>
    <link rel="stylesheet" href="page.css" />
    <script src="page.js" defer></script>
  </head>
  <body>
    <header id="frame" class="frame" data-tauri-drag-region="deep">
      <span id="frame-title" class="frame-title">BMO</span>
      <div id="controls" class="controls" hidden>
        <button id="minimize" type="button" aria-label="최소화" title="최소화">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7.5" width="10" height="1" /></svg>
        </button>
        <button id="maximize" type="button" aria-label="최대화" title="최대화">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 3h10v10H3zm1 1v8h8V4z" />
          </svg>
        </button>
        <button id="close" class="close" type="button" aria-label="닫기" title="닫기">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.7 3 8 7.3 12.3 3l.7.7L8.7 8l4.3 4.3-.7.7L8 8.7 3.7 13l-.7-.7L7.3 8 3 3.7z" />
          </svg>
        </button>
      </div>
    </header>
    <main>
      <div class="panel">
        <header class="head">
          <span id="mark" class="mark" aria-hidden="true"></span>
          <h1 id="headline">에이전트 준비 중</h1>
        </header>
        <div id="detail" class="detail"></div>
        <p id="code" class="code" hidden></p>
        <p id="console-detail" class="detail" hidden></p>
        <div id="status-actions" class="actions">
          <button id="retry" type="button" hidden></button>
          <button id="console" type="button">콘솔 열기</button>
          <button id="switch" type="button" hidden>내장 에이전트로 전환</button>
        </div>
        <form id="server" class="server" novalidate hidden>
          <label for="server-address">BMO 서버 주소</label>
          <input
            id="server-address"
            name="address"
            type="text"
            inputmode="url"
            autocomplete="url"
            autocapitalize="off"
            spellcheck="false"
            placeholder="https://bmo.example.com"
            aria-describedby="server-hint server-error"
          />
          <p id="server-hint" class="hint">https 주소를 입력합니다. http는 localhost에서만 쓸 수 있습니다.</p>
          <p id="server-error" class="error" role="alert" hidden></p>
          <div class="actions">
            <button id="server-cancel" type="button" hidden>취소</button>
            <button id="server-save" class="primary" type="submit">연결</button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
