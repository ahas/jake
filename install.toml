# What installing the jake hub on a fresh machine needs, read by BMO's testbed install verb (bmo-testbed's
# docs/install.md, 「The install declaration」). The hub's file is hub.env.example's, kept in the hub's data directory;
# the rest of bringing it up is docs/deploy.md.

install = 1

restart = "systemctl --user restart jake-hub.service"

[[needs]]
program = "cargo"
what = "Builds the hub and cross-compiles the agent builds every release carries; the Rust toolchain from https://rustup.rs."

[[needs]]
check = "test -x \"$HOME/.bun/bin/bun\""
what = "Runs the agent build and the publish step, both of which name it at ~/.bun/bin/bun; the Bun runtime from https://bun.sh."

[[needs]]
check = "cargo zigbuild --version >/dev/null"
what = "Links the agent builds for Windows and Linux; cargo-zigbuild, installed with cargo install --locked cargo-zigbuild."

[[needs]]
program = "zig"
what = "The linker and C compiler cargo-zigbuild uses for both agent targets; Zig from https://ziglang.org/download/."

[[needs]]
check = "rustup target list --installed | grep -qx x86_64-pc-windows-gnu && rustup target list --installed | grep -qx x86_64-unknown-linux-musl"
what = "The two Rust targets the agent is built for: rustup target add x86_64-pc-windows-gnu x86_64-unknown-linux-musl."

[[needs]]
program = "curl"
what = "Reads the hub's public road and the published agent builds once the install ends; the curl package."

# The deployment publishes the release's agent builds into the folder this machine's web server serves them from,
# a path scripts/publish-agents.ts fixes (docs/deploy.md, 「9. The agent downloads」).
[[needs]]
check = "test -d /var/www/ahas-ai/bmo/jake && test -w /var/www/ahas-ai/bmo/jake"
what = "The folder the agent builds are published to, /var/www/ahas-ai/bmo/jake, made by a person with root, owned by this account with the web server's group and mode 2775, and served by this machine's web server over HTTPS at the address the jake.download-address input names."

[[port]]
name = "jake.agents"
number = 8790

[[port]]
name = "jake.control"
number = 8791

# The shared secret an agent presents.
[[token]]
name = "jake.secret"
file = "env/jake-secret.token"

# The token every control request carries: the console, the node service, the card master and the vision unit.
[[token]]
name = "jake.control"
file = "env/jake-control.token"

# The key an agent's own credential is made with, so a machine joins by approval in the console rather than by the
# shared secret.
[[token]]
name = "jake.agent-key"
file = "env/jake-agent-key.token"

[[input]]
name = "jake.public-name"
what = "The public DNS name remote machines' agents dial the hub at (for example jake.example.org): its record points at a reverse proxy that holds a TLS certificate for it and forwards WebSocket upgrades, with long read and send timeouts and no buffering, to this machine's port 8790."
file = "env/jake-public-name"

[[input]]
name = "jake.download-address"
what = "The HTTPS address the agent builds are downloaded from (for example https://example.org/bmo/jake), the address at which this machine's web server serves the folder the deployment publishes them to."
file = "env/jake-download-address"

# The hub's one file, outside the git tree; the hub listens for agents on every interface and for control on its
# loopback.
[[settings]]
file = "~/.local/share/jake/hub.env"
text = """
JAKE_HUB_PORT={{port.jake.agents}}
JAKE_SECRET={{token.jake.secret}}
JAKE_AGENT_KEY={{token.jake.agent-key}}
JAKE_CONTROL_PORT={{port.jake.control}}
JAKE_CONTROL_TOKEN={{token.jake.control}}
JAKE_AGENT_DOWNLOAD_URL={{input.jake.download-address}}
"""

# The hub's command on the path, linked to the deploy tree's binary so it follows every deployment
# (docs/deploy.md, 「2. The systemd user service」).
[[after]]
id = "command-link"
run = '''
set -eu
mkdir -p "$HOME/.local/bin"
ln -sfn "$HOME/.local/share/jake-hub/deploy/bin/jake-hub" "$HOME/.local/bin/jake-hub"
'''
done = 'test "$(readlink "$HOME/.local/bin/jake-hub")" = "$HOME/.local/share/jake-hub/deploy/bin/jake-hub"'

# The public road whole: the agent server answers 401 to a request without the secret through the public name.
[[verify]]
id = "public-road"
run = '''
set -eu
name="$(cat "${BMO_DATA_DIR:-$HOME/.local/share/bmo/data}/env/jake-public-name")"
test "$(curl -s -o /dev/null -w '%{http_code}' "https://$name/")" = 401
'''
what = "The hub does not answer through its public name: the DNS record, the reverse proxy host with its TLS certificate and WebSocket upgrade, or the firewall opening to the hub's port 8790 is missing."

# The agent install scripts are served where the agents download them.
[[verify]]
id = "downloads"
run = '''
set -eu
address="$(cat "${BMO_DATA_DIR:-$HOME/.local/share/bmo/data}/env/jake-download-address")"
curl -sf -o /dev/null "${address%/}/version.txt"
'''
what = "The published agent builds are not served at the download address: this machine's web server does not serve the publish folder there over HTTPS."
