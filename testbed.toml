# How BMO's testbed deploys this repository, in the testbed's declaration format (docs/deploy.md, step 8).

testbed = 0
name = "jake"

[build]
# The release carries the hub's binary, which the unit runs and the deployment's health asks.
binaries = ["jake-hub"]

[deploy]
root = "~/.local/share/jake-hub"
# The hub's own data directory, holding its env file; every deployment's backup carries it.
data_root = "~/.local/share/jake"
units = ["jake-hub.service"]
# Answers 0 once both the agent server and the control API answer as the hub does.
health = "bin/jake-hub up"

[deploy.backup]
exclude = ["agent.log"]
