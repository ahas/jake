# How BMO's testbed tests and deploys this repository, in the testbed's declaration format (docs/deploy.md, step 8).

testbed = 0
name = "jake"

[test]
# The root workspace's crates, and the test files under `test/`, which build the hub and the agent they start.
# The desktop app is a Cargo workspace of its own (docs/desktop.md, 「The crate and its workspace」), run as a
# project of its own by its `check` script.
languages = ["cargo", "bun"]
setup = ["export PATH=\"$HOME/.bun/bin:$PATH\" && bun install --frozen-lockfile"]

[projects]
discover = false
paths = ["desktop"]

[build]
# The release carries the hub's binary, which the unit runs and the deployment's health asks.
binaries = ["jake-hub"]

# The agent builds of the same commit, cross-compiled into the release's `agents/`, which the hub reads
# its agents' build from and the publish step below serves (docs/deploy.md, steps 8 and 9).
[[build.step]]
id = "agents"
command = "export PATH=\"$HOME/.bun/bin:$HOME/.cargo/bin:$HOME/.local/bin:$PATH\" && bun scripts/build.ts --out \"$(git rev-parse --show-toplevel)/../deploy-releases/$(git rev-parse HEAD | cut -c1-12)/agents\""

[deploy]
root = "~/.local/share/jake-hub"
# The hub's own data directory, holding its env file; every deployment's backup carries it.
data_root = "~/.local/share/jake"
units = ["jake-hub.service"]
# Answers 0 once both the agent server and the control API answer as the hub does.
health = "bin/jake-hub up"

# Once the hub answers, the release's agent builds become what the one-line install downloads.
[[deploy.step]]
id = "publish-agents"
phase = "after-health"
command = "export PATH=\"$HOME/.bun/bin:$PATH\" && bun scripts/publish-agents.ts"

[deploy.backup]
exclude = ["agent.log"]
